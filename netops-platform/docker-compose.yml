services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: netops
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: ${PG_PASSWORD:-netops123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops"]
      interval: 10s
      timeout: 5s
      retries: 5

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    command: ["-retentionPeriod=90d"]
    volumes:
      - vmdata:/storage
    ports:
      - "8428:8428"

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://netops:netops@postgres:5432/netops
      VM_URL: http://victoriametrics:8428
      CREDENTIALS_KEY: ${CREDENTIALS_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: {}
  vmdata: {}
